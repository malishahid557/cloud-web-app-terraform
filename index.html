<!DOCTYPE html>
<html>
<head>
  <title>Project 1 - Cloud Web App</title>
</head>
<body>
  <h1>Hello from S3 + CloudFront!</h1>
  <button onclick="checkBackend()">Check Backend Status</button>
  <p id="result"></p>

  <script>
    function checkBackend() {
      fetch("http://web-alb-858563899.eu-north-1.elb.amazonaws.com")
        .then(response => response.text())
        .then(data => {
          document.getElementById("result").innerText = data;
        })
        .catch(error => {
          document.getElementById("result").innerText = "Error: " + error;
        });
    }
  </script>
</body>
</html>
